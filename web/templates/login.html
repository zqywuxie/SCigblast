<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SCigblast</title><link rel="stylesheet" href="/static/style.css?v={{ asset_version }}"></head>
<body class="auth-page"><main class="auth-layout">
<section class="auth-intro"><a href="/login" class="brand">SCIGBLAST</a><p class="eyebrow">SEQUENCE TO INSIGHT</p><h1>你的分析，<br>从这里继续。</h1><p>提交数据、核对样本、追踪分析进度。<br>任务与操作记录关联到你的账户。</p><div class="auth-workflow"><span>01 · 样本审核</span><span>02 · Pipeline 执行</span><span>03 · 结果查看</span></div></section>
<section class="panel auth-card"><div class="auth-tabs" role="tablist" aria-label="登录或注册"><button class="button button-primary" type="button" role="tab" aria-selected="true" data-auth-tab="login">登录</button><button class="button button-ghost" type="button" role="tab" aria-selected="false" data-auth-tab="register">注册码注册</button></div>
<form id="login-form" class="auth-form"><h2>欢迎回来</h2><p class="muted">使用管理员开通或注册码注册的账户。</p><label class="field"><span class="field-label">用户名</span><input name="username" required minlength="3" maxlength="32" autocomplete="username" placeholder="例如 zqy"></label><label class="field"><span class="field-label">密码</span><input type="password" name="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><button class="button button-primary" type="submit">登录控制台 →</button></form>
<form id="register-form" class="auth-form hidden"><h2>加入分析工作区</h2><p class="muted">请先向管理员获取注册码；每个代码仅限注册一次。</p><label class="field"><span class="field-label">用户名</span><input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_.\-]*" autocomplete="username" placeholder="3–32 位英文、数字、点、下划线或短横线"></label><label class="field"><span class="field-label">姓名</span><input name="display_name" required maxlength="60" autocomplete="name" placeholder="用于任务与操作记录"></label><label class="field"><span class="field-label">密码</span><input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="至少 12 个字符"></label><label class="field"><span class="field-label">确认密码</span><input name="confirm_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label class="field"><span class="field-label">管理员注册码</span><input name="invitation" required maxlength="128" autocomplete="off" spellcheck="false"></label><button class="button button-primary" type="submit">注册账户 →</button></form>
<p id="auth-message" class="auth-message" role="status" aria-live="polite"></p><p class="auth-footnote">忘记密码？请联系服务器管理员重置。</p></section></main><script src="/static/auth.js?v={{ asset_version }}"></script></body></html>
