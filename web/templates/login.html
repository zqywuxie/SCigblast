<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · SCigblast</title><link rel="stylesheet" href="/static/style.css?v={{ asset_version }}"></head>
<body class="auth-page"><main class="auth-layout">
<section class="auth-intro"><a href="/login" class="brand">SCIGBLAST</a><h1>序列分析工作台</h1><p>提交任务、审核样本、查看结果。</p></section>
<section class="panel auth-card"><div class="auth-tabs" role="tablist" aria-label="登录或注册"><button class="button button-primary" type="button" role="tab" aria-selected="true" data-auth-tab="login">登录</button><button class="button button-ghost" type="button" role="tab" aria-selected="false" data-auth-tab="register">注册码注册</button></div>
<form id="login-form" class="auth-form"><h2>登录</h2><label class="field"><span class="field-label">姓名</span><input name="display_name" required maxlength="60" autocomplete="username" placeholder="填写注册时的姓名"></label><label class="field"><span class="field-label">密码</span><input type="password" name="password" required minlength="6" maxlength="128" autocomplete="current-password"></label><button class="button button-primary" type="submit">登录</button></form>
<form id="register-form" class="auth-form hidden"><h2>注册</h2><p class="muted">请先向管理员获取注册码；每个代码仅限注册一次。</p><label class="field"><span class="field-label">姓名</span><input name="display_name" required maxlength="60" pattern="[A-Za-z][A-Za-z0-9 ._\-]*" autocomplete="name" placeholder="英文姓名或缩写，例如 Zheng Qinyun"></label><label class="field"><span class="field-label">密码</span><input name="password" type="password" required minlength="6" maxlength="128" autocomplete="new-password" placeholder="至少 6 个字符"></label><label class="field"><span class="field-label">确认密码</span><input name="confirm_password" type="password" required minlength="6" maxlength="128" autocomplete="new-password"></label><label class="field"><span class="field-label">管理员注册码</span><input name="invitation" required maxlength="128" autocomplete="off" spellcheck="false"></label><button class="button button-primary" type="submit">注册</button></form>
<p id="auth-message" class="auth-message" role="status" aria-live="polite"></p><p class="auth-footnote">忘记密码？请联系服务器管理员重置。</p></section></main><script src="/static/auth.js?v={{ asset_version }}"></script></body></html>
