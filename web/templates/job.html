<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务详情 · SCigblast</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="app-shell detail-shell">
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i></span><span>SCIGBLAST</span></a><div class="topbar-right"><span class="server-state"><b></b> 服务器在线</span><span class="topbar-divider"></span><a class="back-link" href="/">← 返回任务列表</a></div></header>
  <section class="page-head detail-head"><div><p class="eyebrow">JOB DETAIL / <span id="job-id">—</span></p><h1 id="dataset-title">任务详情</h1><p id="job-subtitle" class="page-subtitle">正在读取任务信息…</p></div><div class="detail-head-actions"><div id="hero-status" class="hero-status">加载中…</div><div id="head-actions"></div></div></section>
  <section class="detail-meta" id="meta-cards"></section>
  <section class="stage-panel panel"><div class="panel-heading"><div><p class="eyebrow">PIPELINE PROGRESS</p><h2>执行阶段</h2></div><span id="progress-total" class="progress-total">—</span></div><div id="stages" class="stage-list"></div></section>
  <section class="panel tab-panel"><nav class="detail-tabs" role="tablist" aria-label="任务详情"><button class="detail-tab active" role="tab" aria-selected="true" data-tab="overview">运行概览</button><button class="detail-tab" role="tab" aria-selected="false" data-tab="match">Match 审核</button><button class="detail-tab" role="tab" aria-selected="false" data-tab="log">实时日志</button><button class="detail-tab" role="tab" aria-selected="false" data-tab="artifacts">输出文件</button><button class="detail-tab" role="tab" aria-selected="false" data-tab="audit">参数与记录</button></nav>
    <div id="tab-overview" class="tab-content active"><div id="overview-content"></div></div>
    <div id="tab-match" class="tab-content"><div class="tab-toolbar"><div><h3>Match 结果</h3><p id="match-path" class="muted">尚未生成 summary</p></div><div class="match-counts" id="match-counts"></div></div><div class="match-filter"><label><input type="checkbox" id="errors-only"> 只看 ERROR</label><span id="match-row-count" class="muted"></span></div><div class="table-wrap match-table-wrap"><table><thead id="match-head"></thead><tbody id="match-body"></tbody></table><div id="match-empty" class="empty-state hidden"><strong>暂无 Match 数据</strong><span>任务运行后会在这里显示清单</span></div></div></div>
    <div id="tab-log" class="tab-content"><div class="tab-toolbar"><div><h3>运行日志</h3><p class="muted">只读取新增内容，不会反复扫描整份日志</p></div><div class="log-tools"><label class="check-label"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label><button id="pause-log" class="button button-ghost button-small">暂停刷新</button><button id="copy-log" class="button button-ghost button-small">复制</button></div></div><pre id="log-view" class="log-view">日志尚未生成…</pre></div>
    <div id="tab-artifacts" class="tab-content"><div class="tab-toolbar"><div><h3>输出文件</h3><p class="muted">仅展示关键路径，不通过页面传输大型 FASTQ / FASTA / TSV</p></div></div><div id="artifacts-list" class="artifact-list"></div></div>
    <div id="tab-audit" class="tab-content"><div class="tab-toolbar"><div><h3>参数与操作记录</h3><p class="muted">用于复核本次任务的实际配置和操作过程</p></div></div><div class="audit-layout"><div><h4>提交参数</h4><dl id="options-list" class="options-list"></dl></div><div><h4>操作时间线</h4><div id="audit-timeline" class="audit-timeline"></div></div></div></div>
  </section>
</main><script>window.SCIGBLAST_JOB_ID={{ job_id|tojson }};</script><script src="/static/submission.js"></script><script src="/static/job.js"></script></body></html>
