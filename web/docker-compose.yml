services:
  scigblast-web:
    image: scigblast-web:local
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: scigblast-web
    user: "${SCIGBLAST_UID:?Run deploy.sh or set the host UID}:${SCIGBLAST_GID:?Run deploy.sh or set the host GID}"
    group_add:
      - "${SCIGBLAST_DATA_GID:-${SCIGBLAST_GID}}"
    restart: unless-stopped
    init: true
    ports:
      - "${SCIGBLAST_WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      SCIGBLAST_PIPELINE_ROOT: /opt/scigblast
      SCIGBLAST_REFERENCE_ROOT: /opt/scigblast/igblast
      SCIGBLAST_STATE_DIR: /var/lib/scigblast-web
      HOME: /var/lib/scigblast-web/home
      XDG_CACHE_HOME: /var/lib/scigblast-web/home/.cache
      SCIGBLAST_DEFAULT_OUTPUT_ROOT: ${SCIGBLAST_DEFAULT_OUTPUT_ROOT:-/colddata/SCigblast/results}
      SCIGBLAST_RESOURCE_LOCK_FILE: ${SCIGBLAST_RESOURCE_LOCK_FILE:-/colddata/SCigblast/results/.scigblast-resource.lock}
      SCIGBLAST_SHARED_MEMORY_BUDGET_GB: ${SCIGBLAST_SHARED_MEMORY_BUDGET_GB:-300}
      SCIGBLAST_SHARED_MEMORY_RESERVE_GB: ${SCIGBLAST_SHARED_MEMORY_RESERVE_GB:-150}
      SCIGBLAST_TREEMAP_TIMEOUT_SECONDS: ${SCIGBLAST_TREEMAP_TIMEOUT_SECONDS:-1800}
      SCIGBLAST_TREEMAP_MAX_RSS_MB: ${SCIGBLAST_TREEMAP_MAX_RSS_MB:-2048}
      SCIGBLAST_TREEMAP_MAX_WORKERS: ${SCIGBLAST_TREEMAP_MAX_WORKERS:-2}
      SCIGBLAST_TREEMAP_MEMORY_BUDGET_MB: ${SCIGBLAST_TREEMAP_MEMORY_BUDGET_MB:-4096}
      SCIGBLAST_REPORT_FIGURE_WORKERS: ${SCIGBLAST_REPORT_FIGURE_WORKERS:-auto}
      SCIGBLAST_REPORT_FIGURE_WORKER_MB: ${SCIGBLAST_REPORT_FIGURE_WORKER_MB:-640}
      SCIGBLAST_REPORT_COMPUTE_WORKERS: ${SCIGBLAST_REPORT_COMPUTE_WORKERS:-1}
      SCIGBLAST_REPORT_COMPUTE_WORKER_MB: ${SCIGBLAST_REPORT_COMPUTE_WORKER_MB:-640}
      SCIGBLAST_REPORT_STATISTICS_CACHE_MB: ${SCIGBLAST_REPORT_STATISTICS_CACHE_MB:-0}
      SCIGBLAST_REPORT_HTML_CACHE_MB: ${SCIGBLAST_REPORT_HTML_CACHE_MB:-128}
      SCIGBLAST_REPORT_MAX_RSS_MB: ${SCIGBLAST_REPORT_MAX_RSS_MB:-2048}
      SCIGBLAST_REPORT_TIMEOUT_SECONDS: ${SCIGBLAST_REPORT_TIMEOUT_SECONDS:-14400}
      SCIGBLAST_ALLOWED_INPUT_ROOTS: ${SCIGBLAST_ALLOWED_INPUT_ROOTS:-/colddata/SCigblast/data}
      SCIGBLAST_ALLOWED_SUBMISSION_ROOTS: ${SCIGBLAST_ALLOWED_SUBMISSION_ROOTS:-/colddata/SCigblast/data}
      SCIGBLAST_ALLOWED_BARCODE_ROOTS: ${SCIGBLAST_ALLOWED_BARCODE_ROOTS:-/colddata}
      SCIGBLAST_ALLOWED_OUTPUT_ROOTS: ${SCIGBLAST_ALLOWED_OUTPUT_ROOTS:-/colddata/SCigblast/results:/colddata/zqy/SCigblast/results}
      SCIGBLAST_ARCHIVE_LEGACY_ROOTS: ${SCIGBLAST_ARCHIVE_LEGACY_ROOTS-/colddata/SCigblast/results:/colddata/zqy/SCigblast/results}
      SCIGBLAST_COOKIE_SECURE: ${SCIGBLAST_COOKIE_SECURE:-0}
      SCIGBLAST_ADMIN_USERNAME: ${SCIGBLAST_ADMIN_USERNAME:-}
      SCIGBLAST_ADMIN_PASSWORD: ${SCIGBLAST_ADMIN_PASSWORD:-}
      SCIGBLAST_ADMIN_DISPLAY_NAME: ${SCIGBLAST_ADMIN_DISPLAY_NAME:-}
    volumes:
      - ${SCIGBLAST_HOST_COLD_DATA:-/colddata}:/colddata:ro
      # One project-local reference copy for every pipeline.
      - ${SCIGBLAST_HOST_IGBLAST_ROOT:-../igblast}:/opt/scigblast/igblast:ro
      # Old images and historical configurations resolve to the same copy.
      - ${SCIGBLAST_HOST_IGBLAST_ROOT:-../igblast}:/data/scAnalyis/Scigblast/igblast:ro
      - ${SCIGBLAST_HOST_IGBLAST_ROOT:-../igblast}:/colddata/zqy/igblast:ro
      - ${SCIGBLAST_HOST_RESULTS_ROOT:-/colddata/SCigblast/results}:/colddata/SCigblast/results:rw
      # Compatibility mount for historical job paths.
      - ${SCIGBLAST_HOST_RESULTS_ROOT:-/colddata/SCigblast/results}:/colddata/zqy/SCigblast/results:rw
      - ./runtime:/var/lib/scigblast-web
    mem_limit: 300g
