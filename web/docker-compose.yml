services:
  scigblast-web:
    image: scigblast-web:local
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: scigblast-web
    restart: unless-stopped
    init: true
    ports:
      - "${SCIGBLAST_WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      SCIGBLAST_PIPELINE_ROOT: /opt/scigblast
      SCIGBLAST_STATE_DIR: /var/lib/scigblast-web
      SCIGBLAST_DEFAULT_OUTPUT_ROOT: ${SCIGBLAST_DEFAULT_OUTPUT_ROOT:-/colddata/zqy/SCigblast/results}
      SCIGBLAST_ALLOWED_INPUT_ROOTS: ${SCIGBLAST_ALLOWED_INPUT_ROOTS:-/colddata}
      SCIGBLAST_ALLOWED_SUBMISSION_ROOTS: ${SCIGBLAST_ALLOWED_SUBMISSION_ROOTS:-/colddata}
      SCIGBLAST_ALLOWED_BARCODE_ROOTS: ${SCIGBLAST_ALLOWED_BARCODE_ROOTS:-/colddata}
      SCIGBLAST_ALLOWED_OUTPUT_ROOTS: ${SCIGBLAST_ALLOWED_OUTPUT_ROOTS:-/colddata/zqy/SCigblast/results}
      SCIGBLAST_MAX_ACTIVE_JOBS: ${SCIGBLAST_MAX_ACTIVE_JOBS:-2}
      SCIGBLAST_COOKIE_SECURE: ${SCIGBLAST_COOKIE_SECURE:-0}
    volumes:
      - ${SCIGBLAST_HOST_COLD_DATA:-/colddata}:/colddata:ro
      - /data/scAnalyis/Scigblast/igblast:/data/scAnalyis/Scigblast/igblast:ro
      - ${SCIGBLAST_HOST_RESULTS_ROOT:-/colddata/zqy/SCigblast/results}:/colddata/zqy/SCigblast/results:rw
      - ./runtime:/var/lib/scigblast-web
    mem_limit: 300g
